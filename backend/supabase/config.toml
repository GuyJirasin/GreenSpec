project_id = "greenspec-local"
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 15
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "25MiB"
[auth]
enable_anonymous_sign_ins = true
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
[edge_runtime]
enabled = true
policy = "per_worker"
[functions.analyze]
verify_jwt = true
[functions.revision]
verify_jwt = true
[functions.document]
verify_jwt = true
